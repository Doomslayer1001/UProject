services:
  web:
    image: php:8.2-apache
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db
      - cache

  db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: course_manager
    ports:
      - "3306:3306"

  cache:
    image: redis:latest
    container_name: redis_cache
    ports:
      - "6379:6379"